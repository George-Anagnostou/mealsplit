name: CI

on:
  pull_request:
  push:
    branches: [main, preview]
  workflow_dispatch:

# Checks on every PR. Only branch pushes/manual runs can access deployment environments.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never interrupt a release switch. PR checks can be superseded freely.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build

  # The deploy files, checked without deploying: shell lint, the deploy script's local-mode
  # tests (temp directory, no SSH), and `nginx -t` on the site config.
  deploy-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck scripts/*.sh
      - run: sh scripts/deploy_test.sh
      - name: nginx -t on bootstrap and HTTPS sites
        run: |
          command -v nginx >/dev/null || { sudo apt-get update && sudo apt-get install -y nginx; }
          sudo cp deploy/nginx/mealsplit-http.conf /etc/nginx/sites-enabled/mealsplit.conf
          sudo nginx -t
          # Ephemeral test certificate: no production keys or ACME calls in CI.
          sudo install -d /etc/letsencrypt/live/mealsplit.georgeanagnostou.com
          sudo openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj /CN=mealsplit.georgeanagnostou.com \
            -keyout /etc/letsencrypt/live/mealsplit.georgeanagnostou.com/privkey.pem \
            -out /etc/letsencrypt/live/mealsplit.georgeanagnostou.com/fullchain.pem
          sudo cp deploy/nginx/mealsplit.conf /etc/nginx/sites-enabled/mealsplit.conf
          sh scripts/preview-nginx.sh http | sudo tee /etc/nginx/sites-enabled/mealsplit-preview.conf >/dev/null
          sudo nginx -t
          sudo install -d /etc/letsencrypt/live/preview.mealsplit.georgeanagnostou.com
          sudo cp /etc/letsencrypt/live/mealsplit.georgeanagnostou.com/*.pem \
            /etc/letsencrypt/live/preview.mealsplit.georgeanagnostou.com/
          sh scripts/preview-nginx.sh https | sudo tee /etc/nginx/sites-enabled/mealsplit-preview.conf >/dev/null
          sudo nginx -t

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit chromium
      - run: npm run test:e2e
      # Playwright builds dist/ and tests that exact artifact via vite preview.
      - name: Identify the tested release
        env:
          COMMIT: ${{ github.sha }}
        run: |
          printf '{ "commit": "%s" }\n' "$COMMIT" > dist/release.json
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: site-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    name: Deploy
    needs: [check, deploy-files, e2e]
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/preview')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
      url: ${{ github.ref_name == 'main' && 'https://mealsplit.georgeanagnostou.com' || 'https://preview.mealsplit.georgeanagnostou.com' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Skip superseded commits
        id: tip
        run: |
          latest="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)"
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "A newer commit is on $GITHUB_REF_NAME; skipping this deployment." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/download-artifact@v4
        if: steps.tip.outputs.current == 'true'
        with:
          name: site-${{ github.sha }}
          path: dist/
      - name: Configure pinned SSH connection
        if: steps.tip.outputs.current == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/mealsplit
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/mealsplit ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host mealsplit-deploy
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/mealsplit
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            ConnectTimeout 15
          EOF
      - name: Upload, activate, and verify
        if: steps.tip.outputs.current == 'true'
        env:
          MEALSPLIT_DEPLOY_HOST: mealsplit-deploy
          MEALSPLIT_DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          MEALSPLIT_URL: ${{ vars.VERIFY_URL }}
          MEALSPLIT_SKIP_BUILD: "1"
          MEALSPLIT_EXPECTED_SHA: ${{ github.sha }}
        run: |
          test -n "$MEALSPLIT_DEPLOY_PATH"
          # Production always needs public HTTPS verification. Preview may be bootstrapped
          # before its DNS/TLS are ready; set VERIFY_URL once setup-preview-tls.sh completes.
          if [ "$GITHUB_REF_NAME" = main ]; then
            test "$MEALSPLIT_URL" = https://mealsplit.georgeanagnostou.com
          fi
          sh scripts/deploy.sh
          echo "Deployed \`$GITHUB_SHA\` to **$GITHUB_REF_NAME**." >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$MEALSPLIT_URL" ]; then
            echo "Preview files uploaded; public verification awaits DNS/TLS and the environment VERIFY_URL variable." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Remove SSH credentials
        if: always()
        run: rm -f ~/.ssh/mealsplit ~/.ssh/config ~/.ssh/known_hosts
