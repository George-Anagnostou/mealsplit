# nginx site for mealsplit: static files only, no server process and no database.
#
# Install on the VPS (see docs/DEPLOY.md):
#   sudo install -m 0644 deploy/nginx/mealsplit.conf /etc/nginx/sites-available/mealsplit.georgeanagnostou.com
#   sudo ln -sf /etc/nginx/sites-available/mealsplit.georgeanagnostou.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d mealsplit.georgeanagnostou.com
#
# This file only listens on port 80, like the bookmarks site. certbot --nginx then adds the
# certificate, `listen 443 ssl` and the HTTP -> HTTPS redirect to the installed copy.
#
# scripts/deploy.sh uploads each build to /var/www/mealsplit/releases/<id>/ and points the
# `current` symlink at it, so a deploy or rollback is a single atomic rename.

# Cache policy by path. Only Vite's /assets/ files have a content hash in their name, so only
# they are cached for good. Everything else (index.html, sw.js, the manifest, icons, OCR files)
# is revalidated on every request; nginx answers 304 when nothing changed, so this is cheap.
# The service worker does the real offline caching.
map $uri $mealsplit_cache_control {
    default      "no-cache";
    ~^/assets/   "public, max-age=31536000, immutable";
}

server {
    listen 80;
    listen [::]:80;
    server_name mealsplit.georgeanagnostou.com;

    root /var/www/mealsplit/current;
    index index.html;

    charset utf-8;
    server_tokens off;

    # Compress text. Debian's nginx.conf turns gzip on but only for text/html. The OCR cores are
    # about 4 MB of JavaScript each and shrink a lot. eng.traineddata.gz is application/gzip,
    # which is not in this list, and its location below turns gzip off as well.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # One place for every response header. A location with its own add_header would drop all
    # of these, so the locations below only set types, try_files and gzip.
    add_header Cache-Control $mealsplit_cache_control; # not on errors: a 404 must not be cached for a year
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), payment=(), usb=()" always;
    # Takes effect once certbot serves this site over HTTPS. No includeSubDomains: other
    # georgeanagnostou.com subdomains are hosted elsewhere.
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Everything the app loads comes from this origin (enforced by a test in the repo).
    # - 'wasm-unsafe-eval': the OCR core compiles its embedded WebAssembly in a worker.
    # - style-src 'unsafe-inline': React style props; no inline scripts are allowed.
    # - blob:/data: images: the receipt photo preview and canvas.
    # Venmo, Messages (sms:) and mailto: links are navigations, which CSP does not restrict.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; font-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # The app itself: unknown paths get index.html so a reload on any URL still opens the app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Real files only below here. A missing file must be a 404, never index.html: the browser
    # would otherwise cache HTML as a script (forever, for /assets/) and OCR would break.
    location /assets/ {
        try_files $uri =404;
    }

    location /icons/ {
        try_files $uri =404;
    }

    location = /sw.js {
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location /ocr/ {
        try_files $uri =404;

        # tesseract.js downloads eng.traineddata.gz and unzips it itself, so send the gzip
        # bytes as they are: plain application/gzip with no Content-Encoding header.
        location ~ \.gz$ {
            types { }
            default_type application/gzip;
            gzip off;
            gzip_static off;
            try_files $uri =404;
        }

        # No .wasm files today (the cores embed their wasm), but serve any with the right type
        # so WebAssembly.instantiateStreaming would work.
        location ~ \.wasm$ {
            types { }
            default_type application/wasm;
            try_files $uri =404;
        }
    }

    # No dotfiles (.DS_Store and the like) even if one ends up in a release. /.well-known/ stays
    # reachable for certbot renewals.
    location ~ /\.(?!well-known/) {
        return 404;
    }
}
