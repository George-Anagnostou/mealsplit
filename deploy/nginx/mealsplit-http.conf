# Bootstrap site: install only until the MealSplit certificate has been issued.
# Then replace this site with mealsplit.conf. No other nginx site needs changing.
server {
    listen 80;
    listen [::]:80;
    server_name mealsplit.georgeanagnostou.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/mealsplit/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://mealsplit.georgeanagnostou.com$request_uri;
    }
}
